plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// ─── 修正點 1：直接在最外層、最乾淨的地方把時間字串算好 ───
def formattedTimeInfo = new Date().format("yyyyMMddHHmmss", TimeZone.getTimeZone("GMT+8"))

android {
    namespace "com.huaweidigi.app2"
    compileSdk 36
    //ndkVersion flutter.ndkVersion
    // 加在 android 區塊內
    //ndkVersion = "26.1.10909125"
    ndkVersion "28.1.13356709"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.huaweidigi.app2"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion 24
        targetSdkVersion 36
        versionCode 334
        versionName '2.4.7'
        //multiDexEnabled true
        // ✅ 指定 ABI，避免多餘架構（僅保留 arm64-v8a，支援 16KB page size）
        ndk {
            abiFilters "arm64-v8a","armeabi-v7a"
        }

        // ─── 2. 核心大絕招：用這個直接決定 AAB 的預設前綴檔名 ───
        // 產出的 AAB 會自動變成：威寶通_2.3.9_2026xxxxxx-release.aab
        setProperty("archivesBaseName", "威寶通_${versionName}_${formattedTimeInfo}")
    }

    // ─── 3. 精準複寫 APK 的名字（讓它不要帶有 -release 尾碼，符合你要求的格式） ───
    applicationVariants.all { variant ->
        if (variant.buildType.name == "release") {
            def name = "威寶通"
            def version = variant.versionName

            variant.outputs.all { output ->
                outputFileName = "${name}_${version}_${formattedTimeInfo}.apk"
            }
        }
    }

    packagingOptions {
        exclude "lib/x86_64/librive_text.so"
        exclude "lib/x86/librive_text.so"
        exclude "lib/arm64-v8a/librive_text.so"
        exclude "lib/armeabi-v7a/librive_text.so"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.release
            shrinkResources false
            minifyEnabled false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation files('libs/jtds-1.3.1.jar')
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.2'
    implementation 'org.slf4j:slf4j-nop:1.7.25'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}
